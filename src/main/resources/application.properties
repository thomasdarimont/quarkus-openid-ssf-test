quarkus.console.color=false

# Drop the empty fallback from the default profile — Keycloak mode requires
# an explicit issuer URL.
quarkus.openid-ssf.receiver.transmitter-issuer=${SSF_RECEIVER_TRANSMITTER_ISSUER}

quarkus.openid-ssf.receiver.issuer-aliases.KeycloakSsfPoc=${quarkus.openid-ssf.receiver.transmitter-issuer}

quarkus.openid-ssf.receiver.receiver-managed.description=quarkus-openid-ssf-receiver example (keycloak / POLL)

quarkus.openid-ssf.receiver.expected-audience=https://my.expected.audience.com

# Event types this receiver wants to subscribe to. Required when registering a
# stream — translates to events_requested on the create-stream request. Each
# entry can be a full URI or a built-in / configured alias (CaepSessionRevoked,
# RiscAccountDisabled, …); unknown aliases fail fast at startup with a list of
# the registered names.
quarkus.openid-ssf.receiver.events-requested=CaepSessionRevoked,CaepCredentialChange

# OIDC client for outbound auth — distinct client-id from the
# transmitter-managed example so audit trails / rate-limiting are separable.
quarkus.oidc-client.auth-server-url=${OIDC_ISSUER_URL}
quarkus.oidc-client.client-id=${SSF_RECEIVER_CLIENT_ID}
quarkus.oidc-client.credentials.secret=${SSF_RECEIVER_CLIENT_SECRET}
quarkus.oidc-client.grant.type=client
quarkus.oidc-client.scopes=ssf.read,ssf.manage

# OAuth2 client for outbound auth
#quarkus.openid-ssf.receiver.oauth2.token-endpoint=${OIDC_ISSUER_URL}/protocol/openid-connect/token
#quarkus.openid-ssf.receiver.oauth2.grant-type=client_credentials
#quarkus.openid-ssf.receiver.oauth2.client-id=${SSF_RECEIVER_CLIENT_ID}
#quarkus.openid-ssf.receiver.oauth2.client-secret=${SSF_RECEIVER_CLIENT_SECRET}
#quarkus.openid-ssf.receiver.oauth2.scopes=ssf.read ssf.manage

# --- Example: POLL delivery ---
# Switch to POLL delivery. The transmitter assigns delivery.endpoint_url
# during createStream, so push.delivery-endpoint-url is irrelevant here.
quarkus.openid-ssf.receiver.delivery-method=POLL
quarkus.openid-ssf.receiver.poll.interval=10s
quarkus.openid-ssf.receiver.poll.start-delay=2s
quarkus.openid-ssf.receiver.poll.max-events=50
quarkus.openid-ssf.receiver.poll.return-immediately=true
quarkus.openid-ssf.receiver.poll.drain-on-poll=true
quarkus.openid-ssf.receiver.poll.auto-start=true

# --- Example: PUSH delivery ---
# In PUSH mode the transmitter delivers SETs to an endpoint the receiver hosts.
# The extension exposes that endpoint automatically; the URL below is what gets
# advertised to the transmitter on createStream as delivery.endpoint_url and
# therefore must be reachable from the transmitter (public URL / ngrok / VPN).
#quarkus.openid-ssf.receiver.delivery-method=PUSH
#quarkus.openid-ssf.receiver.push.delivery-endpoint-url=https://receiver.example.com/ssf/events
# Optional bearer token the transmitter is expected to present on inbound pushes.
# Generated and shared out-of-band; leave unset to disable the check.
#quarkus.openid-ssf.receiver.push.delivery-auth-token=${SSF_RECEIVER_PUSH_AUTH_TOKEN}